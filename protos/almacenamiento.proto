syntax = "proto3";

package almacenamiento;

// ===================== NODO DE ALMACENAMIENTO =====================
// Cada nodo guarda archivos en su propia carpeta y los sirve.
service NodoAlmacenamiento {
  // Comprueba que el nodo está vivo (lo usa el coordinador).
  rpc Ping (SolicitudPing) returns (RespuestaPing);
  // Sube un archivo en fragmentos (streaming del cliente).
  rpc SubirArchivo (stream Fragmento) returns (ResultadoSubida);
  // Descarga un archivo en fragmentos (streaming del servidor).
  rpc DescargarArchivo (SolicitudArchivo) returns (stream Fragmento);
  // Devuelve los metadatos de un archivo guardado en el nodo.
  rpc ConsultarMetadatos (SolicitudArchivo) returns (Metadatos);
  // Borra el archivo y sus metadatos del nodo.
  rpc EliminarArchivo (SolicitudArchivo) returns (RespuestaRegistro);
}

// ===================== COORDINADOR =====================
// Sabe qué nodos están vivos y en qué nodos está cada archivo.
service Coordinador {
  // Un nodo se anuncia al arrancar.
  rpc RegistrarNodo (InfoNodo) returns (RespuestaRegistro);
  // Indica a qué nodos subir un archivo o desde cuáles descargarlo.
  rpc UbicarArchivo (SolicitudUbicacion) returns (Ubicacion);
  // Lista todos los archivos conocidos y sus réplicas.
  rpc ListarArchivos (Vacio) returns (ListaArchivos);
  // Devuelve el estado (vivo o caído) de cada nodo registrado.
  rpc EstadoNodos (Vacio) returns (ListaNodos);
  // El cliente informa en qué nodos terminó bien la subida.
  rpc ConfirmarSubida (ConfirmacionSubida) returns (RespuestaRegistro);
  // Elimina un archivo de todas sus réplicas y del índice.
  rpc EliminarArchivo (SolicitudArchivo) returns (ResultadoEliminacion);
  // Envía los eventos recientes de la bitácora y luego cada evento nuevo (streaming del servidor).
  rpc SuscribirEventos (SolicitudEventos) returns (stream Evento);
}

// ---------- Mensajes del nodo ----------
message SolicitudPing {
  string origen = 1;
}

message RespuestaPing {
  string nodo_id = 1;
  int64 archivos_guardados = 2;
}

message Fragmento {
  string nombre = 1;   // archivo al que pertenece
  int32 indice = 2;    // posición del fragmento (0, 1, 2...)
  bytes datos = 3;     // contenido del fragmento
}

message SolicitudArchivo {
  string nombre = 1;
}

message ResultadoSubida {
  bool ok = 1;
  string nodo_id = 2;
  int64 tamano_bytes = 3;
  int32 fragmentos = 4;
  string hash_sha256 = 5;
}

message Metadatos {
  string nombre = 1;
  string nodo_id = 2;
  int64 tamano_bytes = 3;
  string hash_sha256 = 4;
  string fecha_subida = 5;
}

// ---------- Mensajes del coordinador ----------
message Vacio {}

message InfoNodo {
  string nodo_id = 1;     // ej. "nodo1"
  string direccion = 2;   // ej. "localhost:50051"
}

message RespuestaRegistro {
  bool ok = 1;
  string mensaje = 2;
}

enum Operacion {
  SUBIR = 0;
  DESCARGAR = 1;
}

message SolicitudUbicacion {
  string nombre = 1;
  Operacion operacion = 2;
}

message Ubicacion {
  string nombre = 1;
  repeated InfoNodo nodos = 2;   // nodos en orden de preferencia
}

message EntradaArchivo {
  string nombre = 1;
  repeated string nodos = 2;     // ids de los nodos con réplica
}

message ListaArchivos {
  repeated EntradaArchivo archivos = 1;
}

message EstadoNodo {
  string nodo_id = 1;
  string direccion = 2;
  bool vivo = 3;
  int32 archivos = 4;            // cuántos archivos tiene asignados
}

message ListaNodos {
  repeated EstadoNodo nodos = 1;
}

message ConfirmacionSubida {
  string nombre = 1;
  repeated string nodos_ok = 2;  // nodos donde la subida terminó bien
  string hash_sha256 = 3;
  int64 tamano_bytes = 4;
}

message ResultadoEliminacion {
  string nombre = 1;
  repeated string nodos_eliminados = 2;  // réplicas borradas
  repeated string nodos_fallidos = 3;    // réplicas que no se pudieron borrar (nodo caído)
}

message SolicitudEventos {
  int32 ultimos = 1;             // cuántos eventos del historial enviar primero
}

message Evento {
  int64 id = 1;
  string fecha = 2;
  string tipo = 3;               // nodo_caido, archivo_subido, ... ("latido" = mantener la conexión)
  string detalle = 4;
  string usuario = 5;            // quién hizo la acción, si aplica
}