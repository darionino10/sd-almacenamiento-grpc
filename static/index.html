<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Almacenamiento distribuido · gRPC</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-4">
  <div class="container">
    <span class="navbar-brand">Almacenamiento distribuido con gRPC</span>
    <span class="text-secondary small" id="actualizado">—</span>
  </div>
</nav>

<main class="container">

  <!-- Nodos -->
  <h5 class="mb-3">Nodos de almacenamiento</h5>
  <div class="row g-3 mb-4" id="nodos">
    <div class="col text-muted">Cargando…</div>
  </div>

  <div class="row g-4">
    <!-- Subir -->
    <div class="col-lg-4">
      <div class="card shadow-sm">
        <div class="card-body">
          <h5 class="card-title">Subir archivo</h5>
          <input type="file" class="form-control mb-3" id="archivo">
          <button class="btn btn-primary w-100" id="btnSubir">Subir</button>
        </div>
      </div>

      <div class="card shadow-sm mt-4">
        <div class="card-body">
          <h5 class="card-title">Actividad</h5>
          <ul class="list-unstyled small mb-0" id="actividad"></ul>
        </div>
      </div>
    </div>

    <!-- Archivos -->
    <div class="col-lg-8">
      <div class="card shadow-sm">
        <div class="card-body">
          <h5 class="card-title">Archivos</h5>
          <table class="table align-middle mb-0">
            <thead><tr><th>Nombre</th><th>Réplicas</th><th class="text-end">Acciones</th></tr></thead>
            <tbody id="archivos"><tr><td colspan="3" class="text-muted">Cargando…</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</main>

<script>
let estadoNodos = {};

function registrar(texto, tipo = "secondary") {
  const li = document.createElement("li");
  li.className = `text-${tipo} mb-1`;
  li.textContent = `${new Date().toLocaleTimeString()} · ${texto}`;
  const lista = document.getElementById("actividad");
  lista.prepend(li);
  while (lista.children.length > 12) lista.lastChild.remove();
}

async function pedirJSON(url, opciones) {
  const r = await fetch(url, opciones);
  const datos = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(datos.detail || `HTTP ${r.status}`);
  return datos;
}

async function cargarNodos() {
  const cont = document.getElementById("nodos");
  try {
    const nodos = await pedirJSON("/api/nodos");
    if (!nodos.length) {
      cont.innerHTML = '<div class="col text-muted">No hay nodos registrados</div>';
      return;
    }
    cont.innerHTML = "";
    for (const n of nodos) {
      // Avisar en la actividad cuando un nodo cambia de estado
      if (n.id in estadoNodos && estadoNodos[n.id] !== n.vivo) {
        registrar(`${n.id} ${n.vivo ? "volvió a estar disponible" : "NO RESPONDE"}`,
                  n.vivo ? "success" : "danger");
      }
      estadoNodos[n.id] = n.vivo;
      cont.insertAdjacentHTML("beforeend", `
        <div class="col-sm-6 col-lg-3">
          <div class="card shadow-sm border-${n.vivo ? "success" : "danger"}">
            <div class="card-body">
              <div class="d-flex justify-content-between align-items-center">
                <h6 class="mb-0">${n.id}</h6>
                <span class="badge bg-${n.vivo ? "success" : "danger"}">${n.vivo ? "Activo" : "Caído"}</span>
              </div>
              <div class="text-muted small mt-2">${n.direccion}</div>
              <div class="small">${n.archivos} archivo(s)</div>
            </div>
          </div>
        </div>`);
    }
  } catch (e) {
    cont.innerHTML = `<div class="col"><div class="alert alert-danger mb-0">Coordinador no disponible: ${e.message}</div></div>`;
  }
}

async function cargarArchivos() {
  const cuerpo = document.getElementById("archivos");
  try {
    const archivos = await pedirJSON("/api/archivos");
    if (!archivos.length) {
      cuerpo.innerHTML = '<tr><td colspan="3" class="text-muted">No hay archivos</td></tr>';
      return;
    }
    cuerpo.innerHTML = archivos.map(a => `
      <tr>
        <td>${a.nombre}</td>
        <td>${a.replicas.map(r =>
          `<span class="badge bg-${estadoNodos[r] === false ? "danger" : "secondary"} me-1">${r}</span>`).join("")}</td>
        <td class="text-end">
          <button class="btn btn-sm btn-outline-secondary me-1" onclick="verInfo('${a.nombre}')">Info</button>
          <button class="btn btn-sm btn-success" onclick="descargar('${a.nombre}')">Descargar</button>
        </td>
      </tr>`).join("");
  } catch (e) {
    cuerpo.innerHTML = `<tr><td colspan="3" class="text-danger">${e.message}</td></tr>`;
  }
}

async function subir() {
  const entrada = document.getElementById("archivo");
  if (!entrada.files.length) return registrar("Selecciona un archivo primero", "warning");
  const datos = new FormData();
  datos.append("archivo", entrada.files[0]);
  try {
    const r = await pedirJSON("/api/subir", { method: "POST", body: datos });
        for (const res of r.resultados) {
      registrar(res.ok
        ? `${r.nombre} → ${res.nodo}: ${res.fragmentos} fragmento(s), hash ${res.hash_ok ? "OK" : "NO COINCIDE"}`
        : `${r.nombre} → ${res.nodo}: ERROR ${res.error}`, res.ok ? "success" : "danger");
    }
    registrar(`${r.nombre} confirmado por el coordinador en ${r.confirmados.join(", ")}`, "primary");   // ← nueva
    entrada.value = "";
    actualizar();
  } catch (e) {
    registrar(`Error al subir: ${e.message}`, "danger");
  }
}

async function descargar(nombre) {
  try {
    const r = await fetch(`/api/descargar/${encodeURIComponent(nombre)}`);
    if (!r.ok) throw new Error((await r.json()).detail);
    const fallidos = r.headers.get("X-Nodos-Fallidos");
    if (fallidos) registrar(`Falló ${fallidos} → se usó la réplica`, "warning");
    const blob = await r.blob();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = nombre;
    a.click();
    URL.revokeObjectURL(a.href);
    registrar(`${nombre} descargado desde ${r.headers.get("X-Nodo-Origen")}`, "success");
  } catch (e) {
    registrar(`Error al descargar ${nombre}: ${e.message}`, "danger");
  }
}

async function verInfo(nombre) {
  try {
    const info = await pedirJSON(`/api/info/${encodeURIComponent(nombre)}`);
    for (const i of info) {
      registrar(i.error ? `${nombre} en ${i.nodo}: ${i.error}`
                        : `${nombre} en ${i.nodo}: ${i.bytes} bytes, SHA-256 ${i.sha256.slice(0, 12)}…`,
                i.error ? "danger" : "secondary");
    }
  } catch (e) {
    registrar(`Error: ${e.message}`, "danger");
  }
}

async function actualizar() {
  await cargarNodos();
  await cargarArchivos();
  document.getElementById("actualizado").textContent =
    "Actualizado " + new Date().toLocaleTimeString();
}

document.getElementById("btnSubir").addEventListener("click", subir);
actualizar();
setInterval(actualizar, 2000);
</script>
</body>
</html>
